name: 每日天气推送

on:
  schedule:
    # 每天 7:00（UTC+8）执行，GitHub Actions 使用 UTC 时间，所以写 23:00
    - cron: '0 23 * * *'
  workflow_dispatch:  # 支持手动触发测试

jobs:
  weather-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 获取天气并推送
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
          CITY: ${{ secrets.CITY }}
        run: |
          python weather_push.py